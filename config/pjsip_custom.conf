; =============================================================
; Comptes SIP de test — remplacer CHANGE_ME_xxxx par les vrais
; mots de passe (voir config/.env.example)
; =============================================================

[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5060

; ---------- Compte 6001 ----------
[6001]
type=endpoint
context=ivr-entree
disallow=all
allow=ulaw,alaw
auth=auth6001
aors=6001

[auth6001]
type=auth
auth_type=userpass
password=CHANGE_ME_6001
username=6001

[6001]
type=aor
max_contacts=1

; ---------- Compte 6002 ----------
[6002]
type=endpoint
device_state_busy_at=1
context=ivr-entree
disallow=all
allow=ulaw,alaw
auth=auth6002
aors=6002

[auth6002]
type=auth
auth_type=userpass
password=CHANGE_ME_6002
username=6002

[6002]
type=aor
max_contacts=1

; ---------- Compte 6003 ----------
[6003]
type=endpoint
device_state_busy_at=1
context=ivr-entree
disallow=all
allow=ulaw,alaw
auth=auth6003
aors=6003

[auth6003]
