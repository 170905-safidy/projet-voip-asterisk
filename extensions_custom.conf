; =============================================================
; Dialplan complet : IVR, extensions directes, recharge, services,
; facturation automatique, contrôle de crédit, conférence
; =============================================================

[ivr-entree]
exten => 8000,1,Answer()
 same => n,Wait(1)
 same => n,agi(googletts.agi,"Bienvenue. Pour le service commercial, tapez 1. Pour le support technique, tapez 2. Pour la comptabilite, tapez 3.",fr,123,1.0)
 same => n,WaitExten(5)

exten => 1,1,Goto(services,100,1)
exten => 2,1,Goto(services,101,1)
exten => 3,1,Goto(services,102,1)
exten => 9000,1,Goto(services,9000,1)

; Extensions directes (nécessaires : un compte SIP seul n'est pas composable)
exten => 6001,1,Dial(PJSIP/6001,20)
exten => 6002,1,Dial(PJSIP/6002,20)
exten => 6003,1,Dial(PJSIP/6003,20)

; Recharge par composition directe d'un code, ex: #111#
exten => _#XXX#,1,Answer()
 same => n,Set(CODE=${EXTEN})
 same => n,System(sudo -u postgres /usr/local/bin/recharger.sh "${CALLERID(num)}" "${CODE}" >> /var/log/asterisk/recharge.log 2>&1)
 same => n,agi(googletts.agi,"Votre recharge a ete traitee. Merci d'avoir utilise notre service.",fr)
 same => n,Hangup()

exten => t,1,agi(googletts.agi,"Aucune touche recue. Au revoir.",fr)
 same => n,Hangup()

exten => i,1,agi(googletts.agi,"Touche invalide, veuillez recommencer.",fr)
 same => n,Goto(ivr-entree,8000,2)

[facturation]
exten => h,1,NoOp(Facturation de l'appel)
 same => n,System(sudo -u postgres /usr/local/bin/facturer.sh "${CALLERID(num)}" "${CDR(billsec)}" >> /var/log/asterisk/facturation.log 2>&1)

[services]
; ---------- Service commercial ----------
exten => 100,1,Answer()
 same => n,Set(CHANNEL(hangup_handler_push)=facturation,h,1)
 same => n,Set(CREDIT=${SHELL(sudo -u postgres /usr/local/bin/verifier_credit.sh ${CALLERID(num)})})
 same => n,GotoIf($["${CREDIT}" = "REFUS"]?refuse100:continue100)
 same => n(refuse100),agi(googletts.agi,"Solde insuffisant. Veuillez recharger votre compte avant de reessayer.",fr)
 same => n,Hangup()
 same => n(continue100),agi(googletts.agi,"Mise en relation avec le service commercial.",fr)
 same => n,Queue(service_client,t,,,30)
 same => n,Hangup()

; ---------- Support technique ----------
exten => 101,1,Answer()
 same => n,Set(CHANNEL(hangup_handler_push)=facturation,h,1)
 same => n,Set(CREDIT=${SHELL(sudo -u postgres /usr/local/bin/verifier_credit.sh ${CALLERID(num)})})
 same => n,GotoIf($["${CREDIT}" = "REFUS"]?refuse101:continue101)
 same => n(refuse101),agi(googletts.agi,"Solde insuffisant. Veuillez recharger votre compte avant de reessayer.",fr)
 same => n,Hangup()
 same => n(continue101),agi(googletts.agi,"Mise en relation avec le support technique.",fr)
 same => n,Queue(service_client,t,,,30)
 same => n,Hangup()

; ---------- Comptabilité ----------
exten => 102,1,Answer()
 same => n,Set(CHANNEL(hangup_handler_push)=facturation,h,1)
 same => n,Set(CREDIT=${SHELL(sudo -u postgres /usr/local/bin/verifier_credit.sh ${CALLERID(num)})})
 same => n,GotoIf($["${CREDIT}" = "REFUS"]?refuse102:continue102)
 same => n(refuse102),agi(googletts.agi,"Solde insuffisant. Veuillez recharger votre compte avant de reessayer.",fr)
 same => n,Hangup()
 same => n(continue102),agi(googletts.agi,"Mise en relation avec le service comptabilite.",fr)
 same => n,Queue(service_client,t,,,30)
 same => n,Hangup()

; ---------- Conférence ----------
exten => 9000,1,Answer()
 same => n,agi(googletts.agi,"Bienvenue dans la conference. Veuillez patienter, les autres participants vont vous rejoindre.",fr)
 same => n,ConfBridge(salle1)
